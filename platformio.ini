[platformio]
default_envs = megaatmega2560

[mega_common]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
monitor_port = COM8
upload_port = COM8

; 로봇 본 프로그램 (src/main.cpp)
[env:megaatmega2560]
extends = mega_common
build_src_filter = +<*> -<diag/>
lib_deps =
    huskylens/HuskyLens@^1.0.0
    olikraus/U8g2
    knolleary/PubSubClient
    jandrassy/WiFiEspAT@^2.0.0

; 하드웨어 통신 진단 (src/diag/diag_main.cpp)
; 실행: pio run -e diagnose -t upload -t monitor
[env:diagnose]
extends = mega_common
build_src_filter = +<diag/>
monitor_echo = yes
monitor_eol = CRLF
